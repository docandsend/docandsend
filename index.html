  <style>
    :root {
      --ds-navy: #0b2340;
      --ds-gold: #c89a4b;
      --ds-cream: #f6f3ed;
      --ds-text: #222222;
      --ds-muted: #555555;
      --ds-radius-lg: 18px;
      --ds-radius-md: 10px;
      --ds-shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.12);
      --ds-font-sans: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      --ds-max-width: 1120px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-size: 20px;
      font-family: var(--ds-font-sans);
      color: var(--ds-text);
      background: radial-gradient(circle at top left, #fdfaf5 0%, #f3f4f6 55%, #e5e7eb 100%);
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      max-width: var(--ds-max-width);
      margin: 0 auto;
      padding: 24px 20px 60px;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      justify-content: center;
      width: 100%;
    }

    .brand img {
      display: block;
      width: clamp(160px, 45vw, 520px);
      max-width: 60vw;
      height: auto;
      margin: 0 auto;
    }

    .header-cta {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    /* BUTTONS */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--ds-gold), #e3b86e);
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(200, 154, 75, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 38px rgba(200, 154, 75, 0.55);
    }
    
    .btn-secondary {
        background: rgba(11, 35, 64, 0.05);
        color: var(--ds-navy);
        box-shadow: none;
        border: 1px solid rgba(11, 35, 64, 0.1);
    }
    .btn-secondary:hover {
        background: rgba(11, 35, 64, 0.1);
        box-shadow: none;
    }

    /* HERO */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2.3fr);
      gap: 32px;
      align-items: center;
      margin-bottom: 50px;
    }

    .hero-card {
      background: #ffffff;
      border-radius: var(--ds-radius-lg);
      padding: 26px 26px 24px;
      box-shadow: var(--ds-shadow-soft);
      border: 1px solid rgba(15, 23, 42, 0.04);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(11, 35, 64, 0.05);
      color: var(--ds-navy);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .hero-title {
      font-size: 2.1rem;
      line-height: 1.25;
      margin: 0 0 12px;
      color: var(--ds-navy);
    }

    .hero-kicker {
      font-weight: 600;
      color: var(--ds-muted);
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .hero-copy {
      font-size: 0.95rem;
      color: var(--ds-text);
      margin-bottom: 20px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .secondary-link {
      font-size: 0.86rem;
      color: var(--ds-navy);
      text-decoration: underline;
      text-decoration-style: dotted;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .hero-trust {
        display: flex;
        gap: 15px;
        margin-top: 15px;
        font-size: 0.8rem;
        color: var(--ds-muted);
        flex-wrap: wrap;
        border-top: 1px solid rgba(0,0,0,0.05);
        padding-top: 15px;
    }
    .trust-item { display: flex; align-items: center; gap: 6px; }
    .trust-item span { color: var(--ds-gold); font-weight: bold; }

    .hero-highlight {
      background: #2f445c;
      border-radius: var(--ds-radius-lg);
      padding: 22px 22px 18px;
      color: #f9fafb;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.55);
      position: relative;
      overflow: hidden;
    }

    .hero-highlight:before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.12), transparent 55%);
      opacity: 0.9;
    }

    .hero-highlight-inner { position: relative; z-index: 1; }
    .hero-highlight-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; color: var(--ds-gold); }
    .hero-highlight-text { font-size: 0.88rem; color: #e5e7eb; margin-bottom: 12px; }
    .hero-highlight-hours { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px 16px; font-size: 0.85rem; }
    
    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.8);
      color: #e5e7eb;
      font-size: 0.76rem;
      margin-top: 14px;
    }

    section { margin-bottom: 50px; }
    .section-header { margin-bottom: 20px; text-align: center; }
    .section-title { font-size: 1.6rem; font-weight: 700; color: var(--ds-navy); margin: 0 0 8px; }
    .section-tagline { font-size: 1rem; color: var(--ds-muted); }

    .grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { display: grid; gap: 20px; grid-template-columns: repeat(3, minmax(0, 1fr)); }

    .card {
      background: #ffffff;
      border-radius: var(--ds-radius-md);
      padding: 20px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 10px 22px rgba(15,23,42,0.05);
      transition: transform 0.2s ease;
      height: 100%;
    }
    .card:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(15,23,42,0.1); }

    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--ds-navy); margin-bottom: 6px; }
    .card-sub { font-size: 0.9rem; color: var(--ds-muted); margin-bottom: 12px; font-style: italic; }
    .card ul { padding-left: 18px; margin: 6px 0 10px; font-size: 0.92rem; }
    .card ul li + li { margin-top: 4px; }
    
    .pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; font-size: 0.78rem; }
    .pill { padding: 4px 10px; border-radius: 999px; background: rgba(11, 35, 64, 0.06); color: var(--ds-navy); font-weight: 600; }

    /* BIO / PROFILE STYLES */
    .bio-wrapper {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }
    .bio-photo {
      width: 100%;
      max-width: 260px;
      height: auto;
      border-radius: var(--ds-radius-md);
      box-shadow: 0 8px 20px rgba(11, 35, 64, 0.15);
      object-fit: cover;
      flex-shrink: 0;
    }
    .bio-content { width: 100%; }
    
    /* SPECIAL PRICING STYLES */
    .price-item { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px dashed #e5e7eb; }
    .price-item:last-child { border-bottom: none; margin-bottom: 0; }
    .price-label { font-size: 0.95rem; color: var(--ds-text); }
    .price-val { font-weight: 700; color: var(--ds-navy); }
    .price-val.highlight { color: var(--ds-gold); font-size: 1.1rem; }
    
    .price-range-card { background: #0b2340; color: #fff; border: none; }
    .price-range-card .card-title { color: #fff; }
    .price-range-card .card-sub { color: #cbd5f5; }
    .price-range-card .price-label { color: #e5e7eb; }
    .price-range-card .price-val { color: var(--ds-gold); }
    .price-range-card .price-item { border-bottom-color: rgba(255,255,255,0.1); }

    /* PROCESS STEPS */
    .step-card { text-align: center; padding: 24px 16px; }
    .step-num {
        background: var(--ds-navy);
        color: white;
        width: 36px; height: 36px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 12px;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(11, 35, 64, 0.3);
    }

    .cta-strip {
      background: #0b2340;
      border-radius: var(--ds-radius-lg);
      padding: 24px;
      color: #f9fafb;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 18px 42px rgba(15,23,42,0.4);
    }
    .cta-strip-text { font-size: 1.1rem; }

    footer { margin-top: 40px; border-top: 1px solid rgba(148, 163, 184, 0.35); padding-top: 24px; font-size: 0.8rem; color: var(--ds-muted); text-align: center; }
    .seo-footer { margin-top: 12px; font-size: 0.75rem; opacity: 0.8; line-height: 1.8; }
    .seo-footer span { display: inline-block; margin: 0 6px; }

    /* Responsive */
    @media (min-width: 768px) {
      .bio-wrapper {
        flex-direction: row;
        align-items: flex-start;
        text-align: left;
      }
    }

    @media (max-width: 880px) {
      header { flex-direction: column; text-align: center; }
      .hero { grid-template-columns: minmax(0, 1fr); }
      .hero-highlight { order: -1; margin-bottom: 20px; }
      .grid-3 { grid-template-columns: minmax(0, 1fr); }
    }
    @media (max-width: 520px) {
      body { font-size: 18px; }
      .hero-title { font-size: 1.7rem; }
      .page { padding-inline: 16px; }
      .grid-2 { grid-template-columns: minmax(0, 1fr); }
      .price-item { flex-direction: column; gap: 2px; }
    }
  </style>
